{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<form method="post" class="card">
  {{ form.hidden_tag() }}
  <div class="field">
    {{ form.username.label }}
    {{ form.username(size=32, autofocus=true) }}
  </div>
  <div class="field">
    {{ form.password.label }}
    {{ form.password(size=32) }}
  </div>
  {{ form.submit() }}
</form>
{% endblock %}
