{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="login-wrap">
  <form method="post" class="card login-card">
    <div class="brand-icon login-icon">🎵</div>
    <h2>Sign in</h2>
    {{ form.hidden_tag() }}
    <div class="field">
      {{ form.username.label }}
      {{ form.username(autofocus=true) }}
    </div>
    <div class="field">
      {{ form.password.label }}
      {{ form.password() }}
    </div>
    {{ form.submit(class="btn btn-primary btn-block") }}
  </form>
</div>
{% endblock %}
